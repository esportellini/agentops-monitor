name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: pytest app/tests/ -v
        working-directory: backend

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk-python/pyproject.toml
      - run: python -m pip install -e "./sdk-python[dev]" build
      - run: pytest sdk-python/tests/ -v
      - run: python -m build sdk-python

  demo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest
      - run: pytest tests/test_demo.py tests/test_release_version.py -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            sdk-python/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --progress-spinner off
      - run: pip-audit ./sdk-python --progress-spinner off
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure local demo environment
        run: cp .env.example .env
      - name: Run deterministic Docker demo
        run: python scripts/demo.py --reset
      - name: Capture safe failure diagnostics
        if: failure()
        run: |
          mkdir -p .demo
          docker compose --project-name agentops-monitor-demo -f docker-compose.yml -f docker-compose.demo.yml --profile demo logs --no-color backend frontend > .demo/compose.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-demo-diagnostics
          path: |
            .demo/compose.log
            .demo/demo-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Clean Docker demo resources
        if: always()
        run: docker compose --project-name agentops-monitor-demo -f docker-compose.yml -f docker-compose.demo.yml --profile demo down --volumes --remove-orphans
